[package]
name = "arm-core-types"
version = "0.1.0"
edition = "2021"
description = "Wire-contract types shared between the arm-core daemon and its clients (so a Rust/WASM client can share them verbatim). Pure data shapes, no logic."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
