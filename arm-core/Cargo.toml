[package]
name = "arm-core"
version = "0.1.0"
edition = "2021"
description = "General-purpose control daemon for the Dorna 1 arm (g2core/TinyG controller). The arm is a service; plating, vision, and UI are clients."
license = "MIT"

[workspace]
members = ["types", "gateway"]

[dependencies]
# Shared wire-contract types (a future Rust/WASM client depends on the same crate).
arm-core-types = { path = "types" }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Lean by design: no async runtime, no web framework. The driver speaks a
# line-delimited JSON protocol over a Unix socket using std threads (one per
# connection) + a shared, mutex-guarded controller. HTTP lives in the gateway.

[profile.release]
opt-level = 2
lto = false
