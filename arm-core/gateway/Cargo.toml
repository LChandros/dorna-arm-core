[package]
name = "arm-gateway"
version = "0.1.0"
edition = "2021"
description = "HTTP+JSON edge for the arm-core driver: bridges browser/HTTP clients to the driver's Unix-socket line protocol. The browser-facing tier of the 3-tier split."
license = "MIT"

[dependencies]
arm-core-types = { path = "../types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Small synchronous HTTP server, no async runtime — same minimalism as the driver.
tiny_http = "0.12"
